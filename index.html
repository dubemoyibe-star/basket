<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
                
    </head>
    <body>
        <div class="container">
            
            <div id="home-section">
                <h3>HOME</h3>
                <div class="score" id="home-score">
                   <span id="home-el"> 0 </span>
                </div>
                <div class ="button-section">
                    <button id="home1" onclick="add1home()">+1</button>
                    <button id="home2"  onclick="add2home()">+2</button>
                    <button id="home3"  onclick="add3home()">+3</button>
                </div>
            </div>
            
            <div id="guest-section">
                <h3>AWAY</h3>
                 <div class="score" id="guest-score">
                   <span id="guest-el"> 0 </span>
                </div>
                <div class ="button-section">
                    <button id="guest1" onclick="add1guest()">+1</button>
                    <button id="guest2" onclick="add2guest()">+2</button>
                    <button id="guest3" onclick="add3guest()">+3</button>
                </div>
            </div>
             </div>
            
             <div class= "reset">
                    <button id="reset-btn" onclick="setzero()">RESET</button>
                </div>
       
        <script src="index.js"></script>
    </body>
</html>
